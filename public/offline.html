<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Offline - Nagrik Party</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff; color: #1e293b; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      text-align: center;
    }
    .card { max-width: 400px; width: 100%; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p { font-size: 15px; line-height: 1.6; color: #475569; margin-bottom: 24px; }
    button {
      width: 100%; min-height: 52px; border: none; border-radius: 8px;
      background: #e8571a; color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    button:active { background: #c2410c; }
    .link { display: block; margin-top: 14px; color: #e8571a; font-weight: 600; font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Aap offline hain</h1>
    <p>Internet connection nahi mil raha. Chinta na karein, internet wapas aate hi sab kuch theek ho jayega. Aapka saved data safe hai.</p>
    <button type="button" onclick="window.location.reload()">Dobara Try Karein</button>
    <a class="link" href="/">Home par jayein →</a>
  </div>
</body>
</html>
